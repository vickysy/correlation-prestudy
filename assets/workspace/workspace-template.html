<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__SITE_NAME__的自学工作台</title>
<style>
  :root{
    --bg:#F7F1E3; --card:#FFFDF6; --ink:#2B2118; --ink2:#5C4E3D; --ink3:#8F8374;
    --line:#E3D8C2; --navy:#3A2E22; --navy2:#55422F; --gold:#C98A2E; --gold2:#EFE0C0;
    --orange:#A8571F; --teal:#4E6655; --red:#9A3E28; --moss:#5F7250;
    --serif:"Songti SC","Noto Serif SC","STSong",serif;
    --shadow:0 2px 12px rgba(58,46,34,.08);
    --bar:rgba(250,246,237,.94); --side:#FFFDF6; --onnavy:#F7EFDD; --radius:14px; --chip:#EFE6D2;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);}
  a{color:inherit;text-decoration:none;}
  /* ===== 顶栏 ===== */
  .topbar{position:sticky;top:0;z-index:60;background:var(--bar);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:9px 18px;}
  .logo{display:flex;align-items:center;gap:10px;cursor:pointer;}
  .logo-badge{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--navy),var(--navy2));display:flex;align-items:center;justify-content:center;color:var(--gold2);font-weight:700;font-size:13px;}
  .logo-name{font-weight:700;font-size:14.5px;letter-spacing:.5px;}
  .logo-sub{font-size:10px;color:var(--ink3);margin-top:1px;}
  .topbar .sp{flex:1;}
  .kid-chip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);padding:4px 12px 4px 5px;border-radius:999px;}
  .kid-ava{width:26px;height:26px;border-radius:50%;background:var(--navy);color:var(--onnavy);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
  .kid-chip b{font-size:12px;}
  /* ===== 布局 ===== */
  .shell{display:flex;min-height:calc(100vh - 53px);}
  .side{width:188px;flex-shrink:0;background:var(--side);border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:53px;height:calc(100vh - 53px);overflow:auto;}
  .nav-caption{font-size:10px;color:var(--ink3);padding:2px 12px 6px;letter-spacing:2px;}
  .nav-item{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:9px;font-size:13px;color:var(--ink2);cursor:pointer;margin-bottom:3px;border:none;background:none;width:100%;text-align:left;font-family:inherit;}
  .nav-item .ic{width:20px;text-align:center;font-size:15px;}
  .nav-item:hover{background:#F4F0E6;}
  .nav-item.active{background:var(--navy);color:var(--onnavy);font-weight:600;}
  .main{flex:1;padding:22px 26px;min-width:0;}
  .page{display:none;}
  .page.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .page-title{font-size:20px;font-weight:700;margin-bottom:3px;}
  .page-sub{font-size:12.5px;color:var(--ink2);margin-bottom:18px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
  .label{font-size:11px;color:var(--ink3);letter-spacing:1.5px;margin-bottom:10px;font-weight:600;}
  .muted{color:var(--ink3);font-size:12px;line-height:1.7;}
  .quote{font-size:12.5px;color:var(--ink2);line-height:1.8;padding:10px 14px;background:#FBF8F1;border-left:3px solid var(--gold);border-radius:0 8px 8px 0;margin:8px 0;}
  .grid{display:flex;flex-wrap:wrap;gap:14px;}
  .grid .card{flex:1 1 250px;min-width:0;}
  .grid.breathe{gap:22px;}
  .brain-card{padding:24px 26px;display:flex;flex-direction:column;gap:11px;}
  .grid .brain-card{flex:1 1 300px;min-width:0;}
  .brain-card .ic{width:46px;height:46px;border-radius:15px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:23px;}
  .brain-card h4{margin:0;font-size:16px;font-weight:700;color:var(--ink);letter-spacing:.2px;}
  .brain-card .kid{font-size:13.5px;font-weight:600;color:var(--ink2);line-height:1.7;}
  .brain-card .sci{font-size:12px;color:var(--ink3);line-height:1.9;margin:0;}
  .brain-card .src{display:inline-block;align-self:flex-start;font-size:9.5px;color:var(--ink3);background:var(--chip);padding:4px 10px;border-radius:99px;margin-top:4px;letter-spacing:.3px;}
  /* ===== 星系首页 ===== */
  .galaxy{position:relative;background:linear-gradient(160deg,#0E2235,#1B4057);border-radius:18px;padding:24px;color:#EDF3EE;overflow:hidden;}
  .galaxy-title{font-size:16px;font-weight:700;letter-spacing:1px;}
  .galaxy-sub{font-size:12px;color:#AFC4CD;margin-top:4px;}
  .engine-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px;}
  .engine{flex:1 1 160px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0;cursor:pointer;transition:.15s;box-shadow:var(--shadow);}
  .engine:hover{border-color:var(--gold);transform:translateY(-2px);}
  .engine .ei{width:40px;height:40px;border-radius:12px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:21px;}
  .engine .en{font-weight:700;font-size:14px;margin-top:10px;display:block;color:var(--ink);}
  .engine .ed{font-size:11px;color:var(--ink3);margin-top:4px;line-height:1.6;}
  .wheel{margin-top:16px;background:rgba(255,255,255,.05);border-radius:12px;padding:11px 15px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
  .wheel b{font-size:12px;color:#FFF3D6;}
  .wheel-step{font-size:11px;color:#C9DBE0;padding:3px 11px;border:1px dashed #5C8096;border-radius:999px;}
  .arrow{color:#8FB0C0;font-size:11px;}
  .pick-today{margin-top:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
  .pick-today .tp{font-size:11.5px;color:#C9DBE0;}
  .tp-card{background:rgba(255,197,49,.14);border:1px solid rgba(255,197,49,.4);border-radius:10px;padding:8px 13px;font-size:11.5px;color:#FFF3D6;cursor:pointer;}
  .tp-card:hover{background:rgba(255,197,49,.25);}
  /* ===== 首页 hero（数学探险款） ===== */
  .hero{position:relative;overflow:hidden;border-radius:20px;background:radial-gradient(120% 95% at 15% -5%,#1C4460 0%,#0E2235 55%,#081624 100%);color:#FBF7EE;padding:42px 38px 24px;box-shadow:var(--shadow);}
  .hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(1.5px 1.5px at 22% 28%,rgba(255,255,255,.5) 50%,transparent 50%),radial-gradient(1px 1px at 68% 18%,rgba(255,255,255,.4) 50%,transparent 50%),radial-gradient(1.5px 1.5px at 84% 62%,rgba(255,255,255,.35) 50%,transparent 50%),radial-gradient(1px 1px at 38% 72%,rgba(255,255,255,.3) 50%,transparent 50%),radial-gradient(1px 1px at 52% 40%,rgba(255,255,255,.25) 50%,transparent 50%);}
  .hero>*{position:relative;z-index:1;}
  .hero .kicker{display:inline-block;font-size:11px;font-weight:600;letter-spacing:2.5px;color:#8FB0C0;margin-bottom:12px;}
  .hero h1{font-family:var(--serif,"Songti SC","STSong","SimSun",serif);font-weight:900;font-size:clamp(28px,4.2vw,48px);line-height:1.2;letter-spacing:1px;color:#F6EFE0;margin:0;}
  .hero h1 em{font-style:normal;color:#FFC531;text-shadow:0 2px 18px rgba(255,197,49,.35);}
  .hero .lead{margin-top:13px;max-width:600px;font-size:clamp(13px,1.7vw,15px);font-weight:300;color:#D5E3E8;line-height:1.9;}
  .hero .meta-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;}
  .hero .chip{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);color:#EDF3EE;font-size:11px;padding:6px 13px;border-radius:99px;}
  .hero .chip b{color:#FFD166;font-size:12.5px;margin-left:2px;}
  .hero .galaxy-svg{margin-top:16px;}
  .hero .pick-today{margin-top:16px;border-top:1px dashed rgba(255,255,255,.16);padding-top:16px;}
  /* ===== 首页 v2：小星灵引导 + 今日旅程 ===== */
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes twinkle{0%,100%{opacity:.5}50%{opacity:1}}
  .mascot{display:flex;align-items:flex-end;gap:12px;margin-bottom:18px;}
  .mascot .mascot-svg{width:56px;height:56px;animation:floaty 3s ease-in-out infinite;filter:drop-shadow(0 6px 14px rgba(255,197,49,.35));}
  .mascot-bubble{position:relative;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:10px 16px;font-size:13px;color:#F6EFE0;line-height:1.6;}
  .mascot-bubble::before{content:"";position:absolute;left:-6px;bottom:14px;border:6px solid transparent;border-right-color:rgba(255,255,255,.2);}
  .hero h1{font-family:var(--serif,"Songti SC","STSong","SimSun",serif);font-weight:900;font-size:clamp(30px,4.6vw,50px);line-height:1.18;letter-spacing:1px;color:#F6EFE0;margin:0;}
  .today-journey{border-radius:18px;padding:24px 28px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;cursor:pointer;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gold);box-shadow:var(--shadow);transition:.18s;}
  .today-journey:hover{transform:translateY(-2px);border-color:var(--gold);box-shadow:0 10px 26px rgba(58,46,34,.13);}
  .tj-main{flex:1 1 300px;min-width:0;}
  .tj-tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:1.5px;color:var(--orange);background:var(--gold2);padding:4px 12px;border-radius:99px;margin-bottom:12px;}
  .tj-title{font-family:var(--serif);font-size:clamp(19px,2.4vw,26px);font-weight:900;color:var(--ink);line-height:1.45;}
  .tj-sub{font-size:12.5px;color:var(--ink3);margin-top:10px;line-height:1.75;}
  .tj-btn{flex:0 0 auto;background:linear-gradient(135deg,var(--gold),var(--orange));color:#fff;font-weight:800;font-size:15px;padding:13px 30px;border-radius:99px;box-shadow:0 6px 18px rgba(201,138,46,.32);white-space:nowrap;}
  .galaxy-legend{margin-top:14px;font-size:11px;color:#8FB0C0;letter-spacing:.5px;}
  .galaxy-legend b{color:#FFD166;font-size:12px;}
  /* 星图星球化 */
  .pl-glow{animation:twinkle 3.4s ease-in-out infinite;}
  .pl-core{animation:twinkle 2.6s ease-in-out infinite;}
  .star-named{animation:twinkle 3s ease-in-out infinite;}
  /* ===== 首页浅色区段落 ===== */
  .sec-title{font-size:17px;font-weight:800;color:var(--ink);display:inline-block;margin:0 0 14px;letter-spacing:.5px;background-image:linear-gradient(to bottom,var(--gold) 55%,transparent 55%);background-size:100% 11px;background-repeat:no-repeat;background-position:0 78%;}
  .wrap{max-width:960px;margin:0 auto;}
  section.howto,section.modules{margin-top:28px;}
  .howto-grid{display:flex;flex-wrap:wrap;gap:16px;}
  .howto-card{flex:1 1 210px;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow);}
  .howto-card .step-no{font-size:12px;color:var(--gold);font-weight:800;letter-spacing:1px;}
  .howto-card h3{font-size:13.5px;margin:8px 0 6px;color:var(--ink);font-weight:700;line-height:1.5;}
  .howto-card p{font-size:11.5px;color:var(--ink3);line-height:1.75;margin:0;}
  .modules .engine{flex:1 1 172px;}
  .modules .engine .ed{min-height:30px;}
  /* ===== 首页问候 + 星空进度卡 ===== */
  .home-hi{display:flex;align-items:center;gap:13px;margin-bottom:18px;}
  .home-hi .mascot-svg{width:46px;height:46px;flex-shrink:0;animation:floaty 3s ease-in-out infinite;filter:drop-shadow(0 4px 10px rgba(201,138,46,.28));}
  .home-hi .hi-text{font-size:15px;color:var(--ink2);font-weight:600;line-height:1.6;}
  .home-hi .hi-text b{color:var(--ink);}
  .home-hi .hi-text .accent{color:var(--gold);font-family:var(--serif);font-weight:700;}
  .sky-card{background:linear-gradient(160deg,#13293D,#0E2235);border-radius:18px;padding:16px 20px 8px;color:#EDF3EE;margin-top:20px;box-shadow:var(--shadow);}
  .sky-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .sky-title{font-size:14px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:7px;}
  .sky-title .star{color:#FFD166;font-size:15px;}
  .sky-count{font-size:12px;color:#AFC4CD;}
  .sky-count b{color:#FFD166;}
  .sky-svg{max-width:560px;margin:6px auto 0;}
  .sky-hint{font-size:10.5px;color:#7E9FB3;text-align:center;line-height:1.7;padding:4px 8px;}
  .sky-empty{color:#AFC4CD;font-size:13px;line-height:1.9;text-align:center;padding:28px 18px;}
  .net-links{margin-top:10px;border-top:1px solid rgba(255,255,255,.12);padding-top:12px;}
  .nl-title{font-size:12px;font-weight:700;color:#FFD166;letter-spacing:.5px;margin-bottom:8px;}
  .nl-item{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:9px 13px;margin-bottom:7px;}
  .nl-item b{color:#FFF3D6;font-size:12.5px;}
  .nl-x{color:#FFC531;margin:0 6px;}
  .nl-why{color:#AFC4CD;font-size:11.5px;line-height:1.65;margin-top:4px;}
  .nl-empty{color:#7E9FB3;font-size:11.5px;text-align:center;padding:6px;}
  /* ===== 知识宇宙 ===== */
  .subj-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .pill{border:1px solid var(--line);background:var(--card);padding:8px 18px;border-radius:999px;font-size:13px;color:var(--ink2);cursor:pointer;font-family:inherit;}
  .pill.active{background:var(--navy);color:var(--onnavy);border-color:var(--navy);font-weight:600;}
  .unit-grid{display:flex;flex-wrap:wrap;gap:12px;}
  .unit-card{flex:1 1 200px;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px;cursor:pointer;transition:.15s;box-shadow:var(--shadow);}
  .unit-card:hover{border-color:var(--gold);transform:translateY(-2px);}
  /* 知识星河（跨学科知识点卡，不标科目） */
  .k-card{flex:1 1 250px;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 14px;cursor:pointer;transition:.15s;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;position:relative;}
  .k-card:hover{border-color:var(--gold);transform:translateY(-2px);}
  .k-card.done{opacity:.72;}
  .k-ic{width:40px;height:40px;border-radius:12px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:20px;}
  .k-q{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.65;}
  .k-theme{font-size:10.5px;color:var(--ink3);letter-spacing:.3px;}
  .k-done{position:absolute;top:14px;right:14px;font-size:9.5px;color:var(--gold);font-weight:700;}
  .unit-no{display:inline-block;font-size:11px;font-weight:700;color:#8a5a12;background:var(--gold2);padding:2px 10px;border-radius:999px;}
  .unit-no.m{background:var(--navy);color:var(--gold2);}
  .unit-name{font-weight:700;font-size:14px;margin-top:9px;line-height:1.4;}
  .unit-theme{font-size:11px;color:var(--ink3);margin-top:4px;line-height:1.5;}
  .unit-lessons{font-size:10.5px;color:var(--orange);margin-top:8px;font-weight:600;}
  .unit-progress{height:4px;background:var(--line);border-radius:4px;margin-top:9px;overflow:hidden;}
  .unit-progress i{display:block;height:100%;background:var(--gold);border-radius:4px;width:0%;}
  /* 预习卡 */
  .pre-wrap{max-width:760px;margin:0 auto;}
  .back-row{margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .back-btn{border:1px solid var(--line);background:var(--card);padding:6px 14px;border-radius:999px;font-size:12px;color:var(--ink2);cursor:pointer;font-family:inherit;}
  .back-btn:hover{border-color:var(--gold);color:var(--orange);}
  .pre-head{border-radius:14px;padding:20px;color:#EDF3EE;margin-bottom:12px;}
  .pre-head .ph1{font-size:11px;color:#AFC4CD;letter-spacing:2px;}
  .pre-head .ph2{font-family:var(--serif);font-size:22px;font-weight:700;margin-top:5px;}
  .pre-head .ph3{font-size:12px;color:#C9DBE0;margin-top:5px;}
  .act{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:17px 18px;margin-bottom:11px;box-shadow:var(--shadow);}
  .act-tag{font-size:10.5px;font-weight:700;letter-spacing:2px;color:var(--orange);display:flex;align-items:center;gap:6px;margin-bottom:9px;}
  .act-tag .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);}
  .act h4{font-size:15px;margin-bottom:8px;line-height:1.5;}
  .act p{font-size:13.5px;color:var(--ink2);line-height:1.9;}
  .blk{margin-bottom:12px;}
  .blk:last-child{margin-bottom:0;}
  .blk .bt{font-size:11px;font-weight:700;color:var(--moss);border:1px solid rgba(90,122,90,.4);display:inline-block;padding:1px 9px;border-radius:99px;margin-bottom:5px;}
  .blk h5{font-size:14px;margin-bottom:4px;line-height:1.5;}
  .blk p{font-size:13px;color:var(--ink2);line-height:1.85;}
  .facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;}
  .fact{font-size:10.5px;background:var(--chip);color:var(--ink2);padding:2px 9px;border-radius:99px;}
  /* quiz */
  .quiz-opts{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
  .qopt{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:11px 14px;font-size:13.5px;cursor:pointer;transition:.12s;font-family:inherit;color:var(--ink);text-align:left;}
  .qopt:hover{border-color:var(--gold);}
  .qopt.right{border-color:#52A85A;background:#EEF7EE;}
  .qopt.wrong{border-color:#D96A5E;background:#FBF0EE;}
  .quiz-fb{margin-top:10px;border-radius:10px;padding:11px 14px;font-size:13px;line-height:1.8;display:none;}
  .quiz-fb.show{display:block;}
  .quiz-fb.ok{background:#EEF7EE;border:1px solid #CFE7D2;color:#2E6B35;}
  .quiz-fb.no{background:#FBF0EE;border:1px solid #F0D4D0;color:#8A3A30;}
  /* res */
  .res-item{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px dashed var(--line);}
  .res-item:last-child{border-bottom:none;}
  .res-t{flex-shrink:0;font-size:10.5px;font-weight:700;color:var(--onnavy);background:var(--navy);padding:2px 9px;border-radius:99px;margin-top:1px;}
  .res-body{flex:1;min-width:0;}
  .res-body b{font-size:13px;display:block;line-height:1.5;}
  .res-body .d{font-size:11.5px;color:var(--ink3);margin-top:3px;line-height:1.6;}
  .res-go{margin-left:auto;flex-shrink:0;font-size:11.5px;color:var(--orange);font-weight:700;background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:8px;cursor:pointer;}
  .res-go:hover{border-color:var(--orange);}
  .res-go.disabled{opacity:.45;pointer-events:none;}
  /* ===== 大脑工具箱 ===== */
  .brain-card .ic{font-size:23px;}
  .brain-card h4{font-size:14px;margin:8px 0 6px;color:var(--navy);}
  .brain-card .kid{font-size:12.5px;color:var(--ink);font-weight:600;line-height:1.7;margin-bottom:6px;}
  .brain-card .sci{font-size:11.5px;color:var(--ink2);line-height:1.75;}
  .brain-card .src{font-size:10px;color:var(--ink3);margin-top:9px;padding-top:7px;border-top:1px dashed var(--line);}
  /* ===== 档案 ===== */
  .field-row{display:flex;gap:12px;align-items:center;background:var(--card);border:1px dashed var(--line);border-radius:11px;padding:13px 15px;margin-bottom:10px;}
  .field-row .fi{font-size:19px;}
  .field-row b{font-size:13px;display:block;}
  .field-row .fd{font-size:11px;color:var(--ink3);margin-top:3px;}
  .field-row .btn{margin-left:auto;background:var(--card);border:1px solid var(--navy);color:var(--navy);font-size:11px;font-weight:600;padding:6px 13px;border-radius:8px;cursor:pointer;font-family:inherit;}
  .qwall{display:flex;flex-wrap:wrap;gap:9px;}

function applySite(){

var STAR_TAGS = {
  chinese:["G","S","W","H","W","W","H","M"],
  math:["M","M","M","M","M","M","M","M","M","C","G"]
};
var CUR = { subj:"chinese", unit:-1, lesson:-1, tag:"ALL" };
var store = {
  key:"ws_prototype_v2",
  get(){ try{ return JSON.parse(localStorage.getItem(this.key))||{}; }catch(e){ return {}; } },
  set(v){ localStorage.setItem(this.key, JSON.stringify(v)); },
  explored(){ var s=this.get(); return s.ex||[]; },
  add(id){ var s=this.get(); s.ex=s.ex||[]; if(s.ex.indexOf(id)<0){s.ex.push(id);} this.set(s); },
  has(id){ return this.get().ex&&this.get().ex.indexOf(id)>=0; }
};
/* 数学探险进度：与独立探险页 math-adventure 共享（盖章同步到 ws_math） */
function mathExplored(){ var a=[]; try{ a=JSON.parse(localStorage.getItem("ws_math")||"[]"); }catch(e){} return a; }
function hasMath(id){ return mathExplored().indexOf(id)>=0; }
function allExplored(){ var ex=store.explored(); mathExplored().forEach(function(k){ var key=(typeof k==="number")?"m:"+k:(""+k).indexOf("m:")===0?k:"m:"+k; if(ex.indexOf(key)<0) ex.push(key); }); return ex; }

/* 今日旅程：跟着学习进度走，语文 / 数学交替推荐下一站 */
function nextJourney(){
  var ex=allExplored();
  var cNext=null;
  for(var ui=0;ui<CHINESE_UNITS.length;ui++){
    var unit=CHINESE_UNITS[ui], les=unit.lessons;
    for(var li=0;li<les.length;li++){
      if(ex.indexOf("c:"+ui+":"+li)<0){ cNext={type:"chinese",ui:ui,li:li,title:les[li].title,hook:les[li].hook,theme:unit.theme}; break; }
    }
    if(cNext) break;
  }
  var mNext=null;
  for(var i=0;i<MATH_UNITS.length;i++){
    var u=MATH_UNITS[i];
    if(ex.indexOf("m:"+u.id)<0){ mNext={type:"math",id:u.id,title:u.title,hook:u.hook,time:u.time,no:u.no}; break; }
  }
  if(!cNext&&!mNext) return null;
  if(!cNext) return mNext;
  if(!mNext) return cNext;
  // 语文 / 数学交替推进：记住上次推荐的科目
  var last="";
  try{ last=localStorage.getItem("ws_jt_last")||""; }catch(e){}
  var pick;
  if(!last){ pick="chinese"; }              // 首次从语文第一课开始
  else if(last==="math"){ pick="chinese"; }
  else { pick="math"; }
  try{ localStorage.setItem("ws_jt_last", pick); }catch(e){}
  return pick==="chinese" ? cNext : mNext;
}

}

/* ======== 知识联结网络：节点=知识点，边=预设的跨学科关联；探索到相关两点，线才亮 ======== */
function nodeName(key){ var n=starName(key)||""; return n.replace(/（[^）]*）/g,"").replace(/\([^)]*\)/g,"").trim(); }
function shortName(s){ s=String(s||""); return s.length>6 ? s.slice(0,6)+"…" : s; }
function litConnections(){
  var ex=allExplored(), s={}; ex.forEach(function(k){ s[k]=1; });
  return (CONNECTIONS||[]).filter(function(c){ return s[c.a] && s[c.b]; });
}
function renderNetwork(){
  var svg=document.getElementById("netSvg"); if(!svg) return;
  var ex=allExplored(), exSet={}; ex.forEach(function(k){ exSet[k]=1; });
  // 可见节点 = 已探索的 + 与之相关但还没探索的（作为“下一步”的邀请）
  var vis={}; ex.forEach(function(k){ vis[k]=1; });
  (CONNECTIONS||[]).forEach(function(c){ if(exSet[c.a]) vis[c.b]=1; if(exSet[c.b]) vis[c.a]=1; });
  var nodes=Object.keys(vis);
  var cx=330, cy=215, R=nodes.length<=1?0:150, pos={};
  nodes.forEach(function(k,i){ var a=-Math.PI/2 + i*2*Math.PI/nodes.length; pos[k]={x:cx+R*Math.cos(a), y:cy+R*Math.sin(a)}; });
  if(nodes.length===1) pos[nodes[0]]={x:cx,y:cy};
  var h="";
  // 边：两端都探索过 → 金色实线（联结成立）；只探索一端 → 灰色虚线（邀请去探索另一端）
  (CONNECTIONS||[]).forEach(function(c){
    if(!vis[c.a]||!vis[c.b]) return;
    var lit=exSet[c.a]&&exSet[c.b], pa=pos[c.a], pb=pos[c.b];
    h+='<line x1="'+pa.x.toFixed(1)+'" y1="'+pa.y.toFixed(1)+'" x2="'+pb.x.toFixed(1)+'" y2="'+pb.y.toFixed(1)+'" stroke="'+(lit?"#FFC531":"#5C8096")+'" stroke-width="'+(lit?2:1)+'" stroke-dasharray="'+(lit?"none":"4 5")+'" opacity="'+(lit?".9":".35")+'"/>';
  });
  nodes.forEach(function(k){
    var p=pos[k], on=exSet[k], nm=shortName(nodeName(k));
    if(on){
      h+='<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="9" fill="#FFD166" stroke="#F6E7C8" stroke-width="1.5"/>';
    } else {
      h+='<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="8" fill="#17394F" stroke="#5C8096" stroke-width="1" stroke-dasharray="3 3"/>'
        +'<text x="'+p.x.toFixed(1)+'" y="'+(p.y+3.5).toFixed(1)+'" text-anchor="middle" fill="#8FB0C0" font-size="10" font-weight="700">?</text>';
    }
    var ly = p.y>=cy ? p.y+20 : p.y-13;
    h+='<text x="'+p.x.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="middle" fill="'+(on?"#FFF3D6":"#7E9FB3")+'" font-size="10.5">'+esc(nm)+'</text>';
  });
  svg.innerHTML=h;
}
function renderNetLinks(){
  var box=document.getElementById("netLinks"); if(!box) return;
  var lc=litConnections();
  if(!lc.length){ box.innerHTML='<div class="nl-empty">再探索一课和它相关的知识点，这里就会出现你的第一条「联结」。</div>'; return; }
  var h='<div class="nl-title">✦ 你看见的联结</div>';
  lc.forEach(function(c){
    h+='<div class="nl-item"><b>'+esc(nodeName(c.a))+'</b><span class="nl-x">↔</span><b>'+esc(nodeName(c.b))+'</b><div class="nl-why">'+esc(c.why||"")+'</div></div>';
  });
  box.innerHTML=h;
}
/* ======== 动态星图（旧版，已不再调用） ======== */
function starName(key){
  if(key.indexOf("c:")===0){
    var p=key.slice(2).split(":");
    var unit=CHINESE_UNITS[+p[0]];
    if(unit&&unit.lessons[+p[1]]) return unit.lessons[+p[1]].title;
    return "";
  }
  if(key.indexOf("m:")===0){
    var id=+key.slice(2);
    var u=MATH_UNITS[id-1];
    return u?u.title:"";
  }
  return "";
}
function starTag(key){
  if(key.indexOf("c:")===0){
    var ui=+key.slice(2).split(":")[0];
    return STAR_TAGS.chinese[ui]||"";
  }
  if(key.indexOf("m:")===0){ var id=+key.slice(2); return STAR_TAGS.math[id-1]||""; }
  return "";
}
function renderGalaxy(){
  var svg=document.getElementById("galaxySvg");
  if(!svg) return;
  var ex=allExplored();
  var stars={}; // tag -> [names]
  ex.forEach(function(k){
    var t=starTag(k), n=starName(k);
    if(!t||!n) return;
    if(!stars[t]) stars[t]=[];
    if(stars[t].indexOf(n)<0) stars[t].push(n);
  });
  var cx=330, cy=205;
  var h="";
  // 星尘
  var dust=[[56,118,1.2],[126,58,1],[560,64,1.3],[612,168,1],[72,316,1.2],[556,330,1],[300,132,.9],[196,220,.8],[436,214,1.1],[396,58,.9],[236,388,.9],[500,396,1],[150,352,1.1],[512,240,.9],[262,66,1.2]];
  for(var di=0;di<dust.length;di++) h+='<circle cx="'+dust[di][0]+'" cy="'+dust[di][1]+'" r="'+dust[di][2]+'" fill="#9FBBD0" opacity=".18"/>';
  // 星系盘（椭圆轨道）
  h+='<ellipse cx="'+cx+'" cy="'+cy+'" rx="158" ry="66" fill="none" stroke="#5C8096" stroke-width=".9" stroke-dasharray="3 6" opacity=".3" transform="rotate(-14 '+cx+' '+cy+')"/>';
  // 中心太阳（光晕三层）
  h+='<circle cx="'+cx+'" cy="'+cy+'" r="62" fill="#FFC531" opacity=".07"/>';
  h+='<circle cx="'+cx+'" cy="'+cy+'" r="42" fill="#FFC531" opacity=".13"/>';
  h+='<circle cx="'+cx+'" cy="'+cy+'" r="25" fill="#FFC531" opacity=".26"/>';
  h+='<circle class="pl-core" cx="'+cx+'" cy="'+cy+'" r="12" fill="#FFD166"/>';
  h+='<text x="'+cx+'" y="'+(cy+4)+'" text-anchor="middle" fill="#12293F" font-size="11" font-weight="700">'+(SITE&&SITE.name||"我")+'</text>';
  // 中心→星座连线（已探索=金线，未探索=灰蓝虚线）
  CONSTELLATIONS.forEach(function(c){
    var on=stars[c.id]&&stars[c.id].length>0;
    h+='<line x1="'+cx+'" y1="'+cy+'" x2="'+c.x+'" y2="'+c.y+'" stroke="'+(on?'#FFC531':'#5C8096')+'" stroke-width="'+(on?'1.5':'1')+'" stroke-dasharray="'+(on?'none':'4 5')+'" opacity="'+(on?'.85':'.4')+'"/>';
  });
  // 星座：发光的行星
  CONSTELLATIONS.forEach(function(c){
    var list=stars[c.id]||[];
    var on=list.length>0;
    if(on){
      // 行星光环 + 发光核心球
      h+='<ellipse class="pl-glow" cx="'+c.x+'" cy="'+c.y+'" rx="30" ry="11" fill="none" stroke="#FFC531" stroke-width="1.4" opacity=".8" transform="rotate(-16 '+c.x+' '+c.y+')"/>';
      h+='<circle class="pl-core" cx="'+c.x+'" cy="'+c.y+'" r="27" fill="#FFC531" opacity=".15"/>';
      h+='<circle class="pl-glow" cx="'+c.x+'" cy="'+c.y+'" r="16" fill="#FFD166" stroke="#F6E7C8" stroke-width="1.4"/>';
      h+='<text x="'+c.x+'" y="'+(c.y+4)+'" text-anchor="middle" font-size="14">'+c.icon+'</text>';
    } else {
      // 未探索：暗星 + 「？」勾起好奇
      h+='<circle cx="'+c.x+'" cy="'+c.y+'" r="13" fill="#17394F" stroke="#5C8096" stroke-width="1" opacity=".9"/>';
      h+='<text x="'+c.x+'" y="'+(c.y+4)+'" text-anchor="middle" fill="#8FB0C0" font-size="12" font-weight="700">?</text>';
    }
    // 星座名
    h+='<text x="'+c.x+'" y="'+(c.y+(on?31:24))+'" text-anchor="middle" fill="'+(on?'#FFF3D6':'#7E9FB3')+'" font-size="11" font-weight="700">'+c.name+'</text>';
    if(!on){
      h+='<text x="'+c.x+'" y="'+(c.y+37)+'" text-anchor="middle" fill="#5C8096" font-size="9.5">待探索</text>';
    }
    // 命名星：整齐横排成一条星带
    var show=list.slice(0,6);
    var w=show.length>1?(show.length-1)*26:0;
    show.forEach(function(name,i){
      var bx=c.x-w/2+i*26, by=c.y+46;
      h+='<circle class="star-named" cx="'+bx.toFixed(1)+'" cy="'+by+'" r="4" fill="#F6E7C8" stroke="#FFC531" stroke-width="1"><title>'+esc(name)+'</title></circle>';
      h+='<text x="'+bx.toFixed(1)+'" y="'+(by+14)+'" text-anchor="middle" fill="#D8E4E8" font-size="9.5">'+esc(name.length>4?name.slice(0,4)+"…":name)+'</text>';
    });
    if(list.length>6){
      h+='<text x="'+c.x+'" y="'+(c.y+76)+'" text-anchor="middle" fill="#FFC531" font-size="9.5" font-weight="700">+'+(list.length-6)+' 颗</text>';
    }
  });
  svg.innerHTML=h;
}

function allKnowledge(){
  var arr=[];

      arr.push({type:"c",ui:ui,li:li,title:les.title,hook:les.hook,theme:unit.theme,tag:STAR_TAGS.chinese[ui]||"",done:store.has("c:"+ui+":"+li)});

    arr.push({type:"m",id:u.id,title:u.title,hook:u.hook,sub:u.sub,tag:STAR_TAGS.math[u.id-1]||"",done:hasMath(u.id)});

}
function tagInfo(t){ for(var i=0;i<CONSTELLATIONS.length;i++) if(CONSTELLATIONS[i].id===t) return CONSTELLATIONS[i]; return {id:"",name:"更多",icon:"✨"}; }

    nebula=INTERESTS.map(function(it){
      var r=Math.max(20,Math.round(Math.sqrt(it.c)*7.4));
      var big=it.c>=20;
      return '<circle cx="'+it.x+'" cy="'+it.y+'" r="'+r+'" fill="'+(big?'#FFC531':'#5D8CA8')+'" opacity="'+(big?.92:.6)+'"/>'+
        '<text x="'+it.x+'" y="'+(it.y-(big?0:2))+'" text-anchor="middle" fill="'+(big?'#12293F':'#EDF3EE')+'" font-size="'+(big?12:10)+'" font-weight="700">'+it.n+'</text>'+

window.toggleImport=function(){
  var b=document.getElementById("importBox");
  if(!b) return;
  var show=(b.style.display==="none"?"block":"none");
  b.style.display=show;
  if(show){
    var s=document.getElementById("syncMode"), m=document.getElementById("manualMode"), l=document.getElementById("localMode");
    var hasG=!!(SITE&&SITE.hasGetnote);
    if(s) s.style.display=hasG?"block":"none";
    if(m) m.style.display=hasG?"block":"none";
    if(l) l.style.display=hasG?"none":"block";
    var ls=document.getElementById("lastSync");
    if(ls){
      var last="";
      try{ last=localStorage.getItem("ws_last_sync")||""; }catch(e){}
      ls.textContent=last?("上次同步："+last.slice(0,16).replace("T"," ")):"还没同步过，点一下就第一次同步";
    }
  }
};
window.extractLocal=function(){
  var ta=document.getElementById("localText");
  var t=ta?ta.value:"";
  var qs=extractQuestionsLocal(t);
  var prev=[]; try{ prev=JSON.parse(localStorage.getItem("ws_q")||"[]"); }catch(e){}
  var listEl=document.getElementById("localList");
  if(listEl){
    if(!qs.length){
      listEl.innerHTML='<div class="muted">没找到问句——试试多贴一些对话，或换一段带「为什么/怎么/什么」的话。</div>';
    } else {
      listEl.innerHTML=qs.map(function(q,i){
        var already=prev.indexOf(q)>=0;
        return '<label style="display:flex;gap:8px;align-items:flex-start;padding:7px 4px;border-bottom:1px dashed var(--line);cursor:pointer;">'+
          '<input type="checkbox" data-i="'+i+'" '+(already?'disabled':'checked')+' style="margin-top:3px;"/>'+
          '<span style="flex:1;min-width:0;font-size:12px;line-height:1.6;color:var(--ink);">'+esc(q)+'</span>'+
          (already?'<span style="font-size:9.5px;color:#52A85A;white-space:nowrap;">已有 ✓</span>':'')+'</label>';
      }).join("");
    }
  }
  var c=document.getElementById("localCount");
  if(c) c.textContent=qs.length?("找到 "+qs.length+" 个问题"):"";
  var b=document.getElementById("localImport");
  if(b) b.style.display=qs.length?"block":"none";
  window._localQs=qs;
};
window.importLocal=function(){
  var boxes=document.querySelectorAll("#localList input[type=checkbox]");
  var prev=[]; try{ prev=JSON.parse(localStorage.getItem("ws_q")||"[]"); }catch(e){}
  var added=0;
  for(var i=0;i<boxes.length;i++){
    if(boxes[i].checked&&window._localQs&&window._localQs[i]){
      if(prev.indexOf(window._localQs[i])<0){ prev.push(window._localQs[i]); added++; }
    }
  }
  localStorage.setItem("ws_q", JSON.stringify(prev));
  renderProfile();
};
function extractQuestionsLocal(t){
  var kw=["为什么","怎么","什么","如果","是不是","难道","真的吗","对吗","会不会","凭什么","咋","哪","吗","呢","能不能","可不可以"];
  return String(t||"").split(/[\n。！？!?；;]+/).map(function(s){ return s.trim(); }).filter(function(s){
    if(s.length<4||s.length>60) return false;
    return kw.some(function(k){ return s.indexOf(k)>=0; });
  });
}
window.syncNow=function(btn){
  var msg=document.getElementById("syncMsg");
  if(!msg) return;
  msg.textContent="正在从 Get 笔记拉取新增对话…"; msg.style.color="var(--ink2)";
  if(btn) btn.disabled=true;
  var last="";
  try{ last=localStorage.getItem("ws_last_sync")||""; }catch(e){}
  // file:// 打开时也指向本地服务（server 已开放 CORS）
  var base=(location.protocol==="http:"||location.protocol==="https:")?"":"http://localhost:8671";
  fetch(base+"/api/sync?since="+encodeURIComponent(last)).then(function(r){ return r.json(); }).then(function(d){
    if(!d||!d.ok){ msg.textContent=(d&&d.error)||"同步失败"; msg.style.color="#B3543F"; if(btn) btn.disabled=false; return; }
    var qs=d.questions||[];
    var prev=[]; try{ prev=JSON.parse(localStorage.getItem("ws_q")||"[]"); }catch(e){}
    var added=0;
    qs.forEach(function(it){ if(it&&prev.indexOf(it.q)<0){ prev.push(it.q); added++; } });
    localStorage.setItem("ws_q", JSON.stringify(prev));
    if(d.since) localStorage.setItem("ws_last_sync", d.since);
    var m="✓ 同步完成";
    if(added>0) m+="：新增 "+added+" 个问题，已进问题墙";
    else m+="：上次之后没有新问题";
    msg.textContent=m; msg.style.color="#52A85A";
    if(btn) btn.disabled=false;
    setTimeout(function(){ renderProfile(); }, 1400);
  }).catch(function(e){
    msg.textContent="无法连接本地服务（"+(e&&e.message||"")+"）——请先在终端运行 node server.mjs 再点这里"; msg.style.color="#B3543F";
    if(btn) btn.disabled=false;
  });
};
window.toggleLog=function(){ var b=document.getElementById("logBox"); if(b) b.style.display=(b.style.display==="none"?"block":"none"); };
window.pickGetnoteFile=function(input){
  var f=input&&input.files&&input.files[0];
  if(!f) return;
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var data=JSON.parse(reader.result);
      var qs=(data&&data.questions)||[];
      var prev=[]; try{ prev=JSON.parse(localStorage.getItem("ws_q")||"[]"); }catch(e){}
      var listEl=document.getElementById("gnList");
      if(listEl){
        listEl.innerHTML=qs.map(function(it,i){
          var already=prev.indexOf(it.q)>=0;
          return '<label style="display:flex;gap:8px;align-items:flex-start;padding:7px 4px;border-bottom:1px dashed var(--line);cursor:pointer;">'+
            '<input type="checkbox" data-i="'+i+'" '+(already?'disabled':'checked')+' style="margin-top:3px;"/>'+
            '<span style="flex:1;min-width:0;font-size:12px;line-height:1.6;color:var(--ink);">'+esc(it.q)+
            '<span style="display:block;font-size:9.5px;color:var(--ink3);">'+esc(it.date||"")+' · '+esc((it.src||"").slice(0,28))+'</span></span>'+
            (already?'<span style="font-size:9.5px;color:#52A85A;white-space:nowrap;">已有 ✓</span>':'')+
          '</label>';
        }).join("");
      }
      var c=document.getElementById("gnCount");
      if(c) c.textContent="共 "+qs.length+" 个问题，勾选要导入的";
      var b=document.getElementById("gnImport");
      if(b) b.style.display=qs.length?"block":"none";
      window._gnQs=qs;
    }catch(e){ alert("文件解析失败："+e.message); }
  };
  reader.readAsText(f);
};
window.importSelectedQs=function(){
  var qs=window._gnQs||[];
  var boxes=document.querySelectorAll('#gnList input[type=checkbox]:checked');
  var chosen=[];
  for(var i=0;i<boxes.length;i++) chosen.push(qs[parseInt(boxes[i].getAttribute("data-i"),10)]);
  var prev=[]; try{ prev=JSON.parse(localStorage.getItem("ws_q")||"[]"); }catch(e){}
  chosen.forEach(function(it){ if(it&&prev.indexOf(it.q)<0) prev.push(it.q); });
  localStorage.setItem("ws_q", JSON.stringify(prev));
  renderProfile();
};
window.saveLog=function(){
  var l1=document.getElementById("lg1"); if(!l1||!l1.value.trim()) return;
  var l2=document.getElementById("lg2"), l3=document.getElementById("lg3");
  var iters=[]; try{ iters=JSON.parse(localStorage.getItem("ws_iters")||"[]"); }catch(e){}
  var now=new Date();
  iters.unshift({d:(now.getMonth()+1)+"月"+now.getDate()+"日", a:l1.value.trim(), b:(l2?l2.value.trim():""), c:(l3?l3.value.trim():"")});
  localStorage.setItem("ws_iters", JSON.stringify(iters.slice(0,20)));
  renderProfile();
};
window.addQ=function(){
  var inp=document.getElementById("newq");
  if(!inp||!inp.value.trim()) return;
  var extra=[]; try{ extra=JSON.parse(localStorage.getItem("ws_q")||"[]"); }catch(e){}
  extra.push(inp.value.trim());
  localStorage.setItem("ws_q", JSON.stringify(extra));
  renderProfile();
};

function renderAI(){
  var grid=AI_FORMULAS.map(function(f,i){
    var fs=f.fields.map(function(fd,j){
      return '<div style="margin-bottom:7px;"><label style="font-size:10.5px;color:var(--ink3);display:block;margin-bottom:3px;">'+esc(fd[0])+'</label>'+
        '<input class="f-in" data-card="'+i+'" data-i="'+j+'" value="'+esc(fd[1])+'" style="width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;font-size:12px;font-family:inherit;color:var(--ink);"/></div>';
    }).join("");
    return '<div class="card p-card">'+
      '<div class="pt">'+f.ic+' '+f.t+'</div>'+
      '<div class="pw">'+f.d+'<br><span class="hint">'+f.hint+'</span></div>'+
      '<button class="fill-btn" onclick="toggleForm('+i+')">▶ 填一填</button>'+
      '<div class="fill-form" id="ff'+i+'" style="display:none;margin-top:12px;border-top:1px dashed var(--line);padding-top:12px;">'+
        fs+
        '<button class="gen-btn" onclick="genPrompt('+i+',this)">生成提示词并复制</button>'+
        '<textarea class="gen-out" id="go'+i+'" readonly style="display:none;width:100%;height:78px;margin-top:9px;border:1px dashed var(--gold);border-radius:9px;background:var(--bg);padding:9px;font-size:11.5px;line-height:1.6;color:var(--ink);font-family:inherit;"></textarea>'+
      '</div>'+
    '</div>';
  }).join("");
  app(
  '<div class="page-title">🤖 AI 协作者</div>'+
  '<div class="page-sub">十个万能公式，覆盖预习、做题、写作、数学、复盘、思辨…… <b>它只追问，不抢答</b>。点「填一填」，填空就能生成提示词。</div>'+
  '<div class="grid">'+grid+'</div>'+
  '<div class="muted" style="margin-top:16px;text-align:center">提示词是「思维教练」的启动器——AI 是你的思考陪练，不是答案机器。</div>');
}
window.toggleForm=function(i){
  var f=document.getElementById("ff"+i);
  if(f) f.style.display=(f.style.display==="none"?"block":"none");
};
window.genPrompt=function(i,btn){
  var f=AI_FORMULAS[i];
  var vals=[];
  var ins=document.querySelectorAll('#ff'+i+' input[data-card="'+i+'"]');
  for(var k=0;k<ins.length;k++) vals.push(ins[k].value||"");
  var tpl=f.tpl;
  vals.forEach(function(v,k){ tpl=tpl.split("{"+k+"}").join(v); });
  var out=document.getElementById("go"+i);
  out.value=tpl; out.style.display="block";
  out.select();
  try{ document.execCommand("copy"); }catch(e){}
  btn.textContent="已复制 ✓";
  setTimeout(function(){ btn.textContent="生成提示词并复制"; },1600);
};

/* ======== 我的作品 ======== */
function renderWorks(){
  var works=(SITE&&SITE.works)||[];
  var grid;
  if(works.length){
    grid=works.map(function(w){
      return '<div class="card work-card"><div class="work-badge">'+w.badge+'</div><div class="wt">'+w.t+'</div><div class="wm">'+w.m+'</div>'+
        (w.tags||[]).map(function(t){return '<span class="tag">'+t+'</span>';}).join("")+'</div>';
    }).join("");
  } else {
    grid='<div class="card work-card" style="opacity:.9"><div class="work-badge">🌱</div><div class="wt">你的第一件作品</div><div class="wm">做完一件喜欢的事，把它记在这里——它会变成一颗已经点亮的星。</div></div>';
  }
  var quote=(SITE&&SITE.quote)||"";
  app(
  '<div class="page-title">🚀 我的作品</div>'+
  '<div class="page-sub">先做作品，再学概念 —— 每件作品都是一颗已经点亮的星</div>'+
  '<div class="grid">'+grid+'</div>'+
  (quote?'<div class="quote" style="margin-top:14px">'+esc(quote)+'</div>':''));
}

/* ======== 主题切换 ======== */
function applyTheme(t,ev){
  if(ev&&ev.stopPropagation) ev.stopPropagation();
  document.body.className=document.body.className.replace(/\btheme-\w+/g,"").trim()+" theme-"+t;
  try{ localStorage.setItem("ws_theme",t); }catch(e){}
  var opts=document.querySelectorAll(".theme-opt");
  for(var i=0;i<opts.length;i++) opts[i].classList.toggle("active", opts[i].getAttribute("data-t")===t);
  var p=document.getElementById("themePanel");
  if(p) p.classList.remove("show");
}
function toggleThemePanel(ev){
  if(ev&&ev.stopPropagation) ev.stopPropagation();
  var p=document.getElementById("themePanel");
  if(p) p.classList.toggle("show");
}
document.addEventListener("click", function(ev){
  var p=document.getElementById("themePanel");
  if(p&&p.classList.contains("show")&&ev.target&&(!ev.target.closest||!ev.target.closest(".theme-wrap"))) p.classList.remove("show");
});
(function initTheme(){
  var t="literature"; try{ t=localStorage.getItem("ws_theme")||t; }catch(e){}
  document.body.className=document.body.className.replace(/\btheme-\w+/g,"").trim()+" theme-"+t;
})();

/* ======== 启动 ======== */
applySite();
renderHome();
</script>
