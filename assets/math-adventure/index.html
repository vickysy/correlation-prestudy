<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四上数学 · 课前探险地图</title>
<!-- 字体走系统：Songti/SimSun + PingFang/YaHei -->
<style>
/* ===== 设计令牌 ===== */
:root{
  --paper:#F6F1E7;
  --parchment:#EFE5D0;
  --ink:#26332E;
  --teal:#1F3A3A;
  --amber:#D97B29;
  --rust:#B5492E;
  --moss:#5A7A5A;
  --mist:#7A8E9E;
  --line:rgba(38,51,46,.14);
  --serif:'Noto Serif SC', 'Songti SC', 'SimSun', serif;
  --sans:'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans);
  color:var(--ink);
  background:
    radial-gradient(circle at 12% 8%, rgba(217,123,41,.07), transparent 32%),
    radial-gradient(circle at 88% 20%, rgba(90,122,90,.08), transparent 30%),
    var(--paper);
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}

.wrap{max-width:1080px;margin:0 auto;padding:0 22px}

/* ===== 顶栏 ===== */
.topbar{
  position:sticky;top:0;z-index:50;
  backdrop-filter:blur(8px);
  background:rgba(246,241,231,.86);
  border-bottom:1px solid var(--line);
}
.topbar-inner{display:flex;align-items:center;gap:14px;padding:12px 22px;max-width:1080px;margin:0 auto}
.home-link{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--teal);border:1.5px solid var(--line);background:#FFFDF6;padding:6px 13px;border-radius:999px;transition:.15s;white-space:nowrap}
.home-link:hover{border-color:var(--amber);color:var(--amber)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:700;font-size:17px;letter-spacing:.5px}
.brand svg{width:26px;height:26px;color:var(--amber)}
.topbar .progress-mini{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--teal)}
.progress-track{width:120px;height:7px;border-radius:99px;background:rgba(31,58,58,.14);overflow:hidden}
.progress-fill{height:100%;background:var(--amber);border-radius:99px;transition:width .5s ease}
.progress-mini b{font-family:var(--serif);font-size:15px}

/* ===== Hero ===== */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(21,33,30,.42),rgba(21,33,30,.66))}
.hero-body{position:relative;max-width:1080px;margin:0 auto;padding:74px 22px 60px;color:#FBF7EE}
.hero .kicker{
  display:inline-flex;align-items:center;gap:8px;font-size:13px;letter-spacing:3px;
  color:#F3DFC0;text-transform:uppercase;border:1px solid rgba(243,223,192,.45);
  padding:6px 14px;border-radius:99px;margin-bottom:20px;backdrop-filter:blur(2px)
}
.hero h1{font-family:var(--serif);font-weight:900;font-size:clamp(34px,6vw,60px);line-height:1.15;letter-spacing:1px}
.hero h1 em{font-style:normal;color:var(--amber)}
.hero .lead{margin-top:16px;max-width:640px;font-size:clamp(15px,2vw,18px);font-weight:300;color:#EFE7D8}
.hero .meta-row{display:flex;flex-wrap:wrap;gap:14px;margin-top:26px}
.chip{
  display:inline-flex;align-items:center;gap:8px;font-size:13px;
  background:rgba(246,241,231,.14);border:1px solid rgba(246,241,231,.32);
  padding:8px 15px;border-radius:99px;color:#F3ECDD;backdrop-filter:blur(3px)
}
.chip b{color:#F6C48F}

/* ===== 玩法说明 ===== */
.howto{padding:46px 0 8px}
.howto h2,.sec-title{font-family:var(--serif);font-weight:700;font-size:24px;letter-spacing:.5px;display:flex;align-items:center;gap:12px}
.sec-title::before{content:"";width:6px;height:24px;background:var(--amber);border-radius:3px}
.howto-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:22px}
.howto-card{
  background:var(--parchment);border:1px solid var(--line);border-radius:16px;
  padding:22px 20px;position:relative
}
.howto-card .step-no{
  font-family:var(--serif);font-weight:900;font-size:30px;color:var(--amber);line-height:1
}
.howto-card h3{margin-top:10px;font-family:var(--serif);font-size:17px}
.howto-card p{margin-top:6px;font-size:14px;color:rgba(38,51,46,.78)}

/* ===== 探险路径 ===== */
.journey{padding:42px 0 20px}
.path{position:relative;margin-top:30px;padding:6px 0}
.path-line{
  position:absolute;left:50%;top:0;bottom:0;width:3px;transform:translateX(-50%);
  background-image:linear-gradient(to bottom,var(--amber) 60%,transparent 60%);
  background-size:100% 26px;background-repeat:repeat-y;opacity:.55
}
.station{
  position:relative;width:100%;max-width:640px;margin:0 auto 26px;
  background:#FDFAF2;border:1px solid var(--line);border-radius:18px;overflow:hidden;
  box-shadow:0 6px 22px rgba(31,58,58,.07);transition:transform .25s ease,box-shadow .25s ease;
}
.station:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(31,58,58,.14)}
.station .cover{position:relative;height:170px;overflow:hidden}
.station .cover img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
.station:hover .cover img{transform:scale(1.05)}
.station .no-badge{
  position:absolute;top:14px;left:14px;z-index:2;
  width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  background:var(--teal);color:#F3DFC0;font-family:var(--serif);font-weight:700;font-size:19px;
  border:2px solid rgba(243,223,192,.55);box-shadow:0 4px 10px rgba(0,0,0,.25)
}
.station .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 52%,rgba(21,33,30,.5))}
.station .time-tag{
  position:absolute;right:12px;top:12px;z-index:2;font-size:12px;color:#F3E7D2;
  background:rgba(21,33,30,.55);padding:4px 11px;border-radius:99px;border:1px solid rgba(243,231,210,.4)
}
.station .body{padding:18px 20px 20px}
.station h3{font-family:var(--serif);font-size:21px;font-weight:700}
.station .hook{margin-top:6px;font-size:14px;color:rgba(38,51,46,.82);font-weight:300}
.station .foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.station .go{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:500;color:var(--amber)}
.station .go svg{width:15px;height:15px;transition:transform .2s}
.station:hover .go svg{transform:translateX(3px)}
.stamp{
  position:absolute;right:14px;top:56px;z-index:3;transform:rotate(-14deg);
  width:74px;height:74px;border-radius:50%;display:grid;place-items:center;
  color:var(--rust);border:3px solid var(--rust);opacity:.9;
  background:rgba(246,241,231,.55);backdrop-filter:blur(2px);
  font-family:var(--serif);font-weight:900;font-size:20px;letter-spacing:2px
}
.stamp small{display:block;font-size:10px;font-weight:700;letter-spacing:1px;text-align:center;line-height:1.2}
.stamp-done{animation:stampIn .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes stampIn{0%{transform:rotate(-14deg) scale(2.2);opacity:0}100%{transform:rotate(-14deg) scale(1);opacity:.9}}

/* ===== 单元详情 ===== */
.unit-hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.unit-hero img{width:100%;height:300px;object-fit:cover;object-position:center}
.unit-hero .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(21,33,30,.15),rgba(21,33,30,.72))}
.unit-hero .cap{position:absolute;left:0;right:0;bottom:0;max-width:1080px;margin:0 auto;padding:26px 22px;color:#FBF7EE}
.unit-hero .back{
  position:absolute;top:16px;left:18px;z-index:5;display:inline-flex;align-items:center;gap:7px;
  color:#F3E7D2;font-size:14px;background:rgba(21,33,30,.5);padding:8px 15px;border-radius:99px;border:1px solid rgba(243,231,210,.35)
}
.unit-hero .back svg{width:15px;height:15px}
.unit-hero h1{font-family:var(--serif);font-weight:900;font-size:clamp(26px,4.5vw,40px)}
.unit-hero .sub{margin-top:6px;font-weight:300;color:#EFE7D8;font-size:15px}
.unit-hero .meta-line{margin-top:12px;display:flex;flex-wrap:wrap;gap:10px}

/* 探险步骤 */
.stage-wrap{max-width:720px;margin:0 auto;padding:34px 22px 80px}
.acts-progress{display:flex;align-items:center;gap:8px;margin-bottom:26px}
.acts-progress .dot{width:10px;height:10px;border-radius:50%;background:rgba(31,58,58,.18);transition:background .3s}
.acts-progress .dot.on{background:var(--amber)}
.acts-progress .bar{flex:1;height:2px;background:rgba(31,58,58,.14);position:relative}
.acts-progress .bar i{position:absolute;left:0;top:0;height:100%;background:var(--amber);width:0;transition:width .4s}

.act{animation:actIn .45s ease both}
@keyframes actIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.act .act-label{display:inline-flex;align-items:center;gap:8px;font-size:13px;letter-spacing:2px;color:var(--amber);font-weight:500;margin-bottom:8px}
.act .act-label svg{width:16px;height:16px}

.hook-box{
  background:var(--teal);color:#F3ECDD;border-radius:18px;padding:30px 26px;position:relative;overflow:hidden
}
.hook-box::before{content:"？”";position:absolute;right:-14px;top:-34px;font-family:var(--serif);font-size:130px;color:rgba(243,223,192,.14);line-height:1}
.hook-box h2{font-family:var(--serif);font-weight:700;font-size:clamp(21px,3.4vw,28px);line-height:1.5;position:relative}
.hook-box .hint{margin-top:14px;font-size:14px;color:#D8CFB8;position:relative}

.story-block{margin-top:6px}
.story-sec{
  background:#FDFAF2;border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:16px
}
.story-sec h3{font-family:var(--serif);font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px}
.story-sec h3 .tag{font-size:11px;font-family:var(--sans);color:var(--rust);border:1px solid rgba(181,73,46,.4);padding:2px 9px;border-radius:99px;letter-spacing:1px}
.story-sec p{margin-top:10px;font-size:15px;color:rgba(38,51,46,.86);font-weight:300}
.story-sec p b{font-weight:700;color:var(--teal)}
.fact-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.fact{font-size:12px;color:var(--moss);border:1px solid rgba(90,122,90,.4);padding:3px 10px;border-radius:99px}

.quiz-box{background:var(--parchment);border:1px solid var(--line);border-radius:18px;padding:24px 22px}
.quiz-box .q{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.6}
.quiz-box .q-sub{font-size:13px;color:rgba(38,51,46,.6);margin-top:4px}
.quiz-opts{margin-top:16px;display:grid;gap:11px}
.quiz-opt{
  text-align:left;display:flex;gap:13px;align-items:flex-start;padding:14px 16px;border-radius:13px;
  background:#FDFAF2;border:1.5px solid rgba(31,58,58,.18);font-size:15px;transition:border-color .2s,background .2s
}
.quiz-opt:hover{border-color:var(--teal)}
.quiz-opt .k{flex:0 0 26px;height:26px;border-radius:50%;border:1.5px solid rgba(31,58,58,.4);display:grid;place-items:center;font-size:13px;font-weight:700}
.quiz-opt.correct{background:rgba(90,122,90,.14);border-color:var(--moss)}
.quiz-opt.correct .k{background:var(--moss);color:#fff;border-color:var(--moss)}
.quiz-opt.wrong{background:rgba(181,73,46,.08);border-color:var(--rust)}
.quiz-opt.wrong .k{background:var(--rust);color:#fff;border-color:var(--rust)}
.quiz-opt.dim{opacity:.5}
.quiz-why{margin-top:14px;font-size:14px;color:rgba(38,51,46,.8);border-left:3px solid var(--amber);padding:4px 0 4px 14px;display:none}
.quiz-why.show{display:block;animation:actIn .35s ease}

.goclass{
  background:linear-gradient(160deg,rgba(90,122,90,.14),rgba(31,58,58,.1));
  border:1px dashed var(--moss);border-radius:18px;padding:24px 22px
}
.goclass h3{font-family:var(--serif);font-weight:700;font-size:18px;display:flex;align-items:center;gap:9px}
.goclass p{margin-top:10px;font-size:15px}
.parent-note{margin-top:14px;font-size:13.5px;color:rgba(38,51,46,.7);background:#FDFAF2;border-radius:12px;padding:12px 16px}
.parent-note b{color:var(--rust)}

.act-nav{display:flex;align-items:center;justify-content:space-between;margin-top:26px;gap:14px}
.btn-primary{
  display:inline-flex;align-items:center;gap:10px;background:var(--amber);color:#fff;
  font-size:16px;font-weight:600;padding:14px 26px;border-radius:99px;box-shadow:0 8px 20px rgba(217,123,41,.32);
  transition:transform .2s,box-shadow .2s
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(217,123,41,.4)}
.btn-primary svg{width:17px;height:17px}
.btn-ghost{font-size:14px;color:rgba(38,51,46,.6);padding:10px 8px}
.btn-stamp{
  display:inline-flex;align-items:center;gap:10px;background:var(--teal);color:#F3DFC0;
  font-size:16px;font-weight:600;padding:14px 26px;border-radius:99px;box-shadow:0 8px 20px rgba(31,58,58,.3)
}
.btn-stamp svg{width:18px;height:18px}
.stamp-big{display:none;position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);z-index:90;pointer-events:none}
.stamp-big.show{display:grid;place-items:center;width:190px;height:190px;border-radius:50%;border:6px solid var(--rust);color:var(--rust);background:rgba(246,241,231,.9);font-family:var(--serif);font-weight:900;font-size:46px;letter-spacing:4px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:stampPop .7s cubic-bezier(.2,1.4,.4,1) both}
.stamp-big small{display:block;font-size:15px;font-weight:700;letter-spacing:3px;text-align:center}
@keyframes stampPop{0%{transform:translate(-50%,-50%) scale(3);opacity:0}60%{transform:translate(-50%,-50%) scale(.94);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
.done-banner{
  text-align:center;background:linear-gradient(140deg,var(--teal),#2A4B47);color:#F3DFC0;
  border-radius:18px;padding:28px 22px;margin-top:26px
}
.done-banner h3{font-family:var(--serif);font-size:20px}
.done-banner p{margin-top:6px;font-size:14px;color:#D8CFB8}

/* ===== 时间线 ===== */
.tl{padding:40px 0 70px}
.tl-head{text-align:center;margin-bottom:8px}
.tl-head h2{font-family:var(--serif);font-weight:900;font-size:clamp(26px,4vw,38px)}
.tl-head p{color:rgba(38,51,46,.66);font-weight:300;margin-top:6px}
.tl-line{position:relative;max-width:760px;margin:34px auto 0;padding-left:26px}
.tl-line::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;margin-bottom:14px}
.tl-item::before{content:"";position:absolute;left:-26px;top:9px;width:14px;height:14px;border-radius:50%;background:var(--paper);border:3px solid var(--amber)}
.tl-item .y{font-family:var(--serif);font-weight:700;color:var(--amber);font-size:15px}
.tl-item .t{font-size:15px}
.tl-item .u{margin-left:8px;font-size:11.5px;color:var(--moss);border:1px solid rgba(90,122,90,.4);padding:1px 8px;border-radius:99px;cursor:pointer}
.tl-item .u:hover{background:rgba(90,122,90,.12)}
.tl-legend{margin-top:24px;font-size:12.5px;color:rgba(38,51,46,.55);text-align:center}

/* ===== 给家长 ===== */
.parents{padding:36px 0 60px}
.parents-card{background:var(--teal);color:#EFE7D8;border-radius:20px;padding:30px 28px;position:relative;overflow:hidden}
.parents-card h2{font-family:var(--serif);font-weight:700;font-size:22px}
.parents-card ul{margin-top:14px;display:grid;gap:10px;font-size:14.5px;font-weight:300;list-style:none}
.parents-card li{display:flex;gap:11px}
.parents-card li::before{content:"";flex:0 0 7px;height:7px;border-radius:50%;background:var(--amber);margin-top:9px}

.foot-note{text-align:center;padding:24px 0 40px;font-size:12.5px;color:rgba(38,51,46,.55);font-weight:300}

/* ===== 资源库 ===== */
.res-box{background:#FDFAF2;border:1px solid var(--line);border-radius:18px;padding:22px 20px}
.res-intro{font-size:14px;font-weight:300;color:rgba(38,51,46,.75);margin-bottom:14px}
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.res-card{display:flex;flex-direction:column;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.res-card .rt{font-size:11px;letter-spacing:1px;color:var(--rust);font-weight:600}
.res-card h4{font-family:var(--serif);font-size:15px;line-height:1.5}
.res-card p{font-size:12.5px;font-weight:300;color:rgba(38,51,46,.72);flex:1}
.res-card a{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--amber);margin-top:2px}
.res-card a svg{width:13px;height:13px}

/* ===== 打印版探险手册 ===== */
.print-toolbar{position:sticky;top:0;z-index:40;background:rgba(246,241,231,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.print-toolbar-inner{max-width:820px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px}
.print-toolbar .t{font-family:var(--serif);font-weight:700;font-size:16px}
.btn-print{display:inline-flex;align-items:center;gap:9px;background:var(--teal);color:#F3DFC0;font-size:15px;font-weight:600;padding:12px 22px;border-radius:99px;margin-left:auto}
.btn-print svg{width:16px;height:16px}
.print-wrap{max-width:820px;margin:0 auto;padding:26px 20px 60px}
.print-page{background:#fff;border:1px solid var(--line);border-radius:14px;padding:30px 30px 24px;margin-bottom:24px;box-shadow:0 4px 16px rgba(31,58,58,.06)}
.print-cover{text-align:center}
.print-cover img.cover-pic{width:100%;height:230px;object-fit:cover;border-radius:12px;margin-bottom:20px}
.print-cover h1{font-family:var(--serif);font-weight:900;font-size:34px}
.print-cover .sub{margin-top:8px;color:rgba(38,51,46,.7);font-weight:300}
.print-steps{margin-top:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;text-align:left}
.print-steps .s{background:var(--parchment);border-radius:12px;padding:14px 16px;font-size:13.5px}
.print-steps .s b{display:block;font-family:var(--serif);font-size:15px;margin-bottom:4px;color:var(--teal)}
.pu-head{display:flex;align-items:baseline;gap:14px;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:14px}
.pu-head .no{font-family:var(--serif);font-weight:900;font-size:30px;color:var(--amber)}
.pu-head h2{font-family:var(--serif);font-weight:700;font-size:24px}
.pu-head .tm{margin-left:auto;font-size:13px;color:rgba(38,51,46,.6)}
.pu-pic{float:right;width:150px;height:110px;object-fit:cover;border-radius:10px;margin:0 0 12px 16px;border:1px solid var(--line)}
.pu-hook{background:var(--teal);color:#F3ECDD;border-radius:12px;padding:14px 18px;font-family:var(--serif);font-size:16px;line-height:1.6;margin-bottom:14px}
.pu-points h3,.pu-think h3,.pu-task h3{font-family:var(--serif);font-size:16px;display:flex;align-items:center;gap:8px;margin:14px 0 8px}
.pu-points h3::before{content:"";width:5px;height:16px;background:var(--amber);border-radius:2px}
.pu-points ul{margin-left:18px;display:grid;gap:6px;font-size:14px;color:rgba(38,51,46,.88)}
.pu-points li::marker{color:var(--amber)}
.pu-think{background:#FDFAF2;border:1px solid var(--line);border-radius:12px;padding:14px 18px}
.pu-think .q{font-family:var(--serif);font-size:15px;font-weight:700}
.pu-think .opts{margin-top:8px;display:grid;gap:6px;font-size:14px}
.pu-think .opts span b{font-weight:700}
.pu-answer{margin-top:10px;font-size:13px;color:var(--moss);border-top:1px dashed var(--line);padding-top:8px}
.pu-task{font-size:14px;margin-top:8px}
.pu-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:18px;border-top:1px dashed var(--line);padding-top:14px}

          '<span class="chip">学校进度：'+u.time+'</span>'+

        '</div>'+
      '</div>'+
    '</section>'+

  var wrap = document.getElementById("stageWrap");
  var acts = [
    {label:"好奇钩子", body:
      '<div class="hook-box"><h2>'+u.hook+'</h2><p class="hint">先自己想一想，别急着往下翻——带着这个问题去读下面的故事。</p></div>'},
    {label:"背后的故事", body: stories},
    {label:"想一想", body:
      '<div class="quiz-box"><div class="q">'+u.quiz.q+'</div><p class="q-sub">点选一个答案，看看你的判断。</p>'+
      '<div class="quiz-opts">'+
        u.quiz.opts.map(function(o,i){return '<button class="quiz-opt" data-i="'+i+'"><span class="k">'+String.fromCharCode(65+i)+'</span><span>'+o+'</span></button>'}).join("")+
      '</div><div class="quiz-why" id="quizWhy"><b>解析：</b>'+u.quiz.why+'</div></div>'},
    {label:"带着问题去上课", body:
      '<div class="goclass"><h3>上课小任务</h3><p>'+u.task+'</p>'+
      '<div class="parent-note"><b>给家长：</b>'+u.parent+'</div></div>'},
    {label:"想深入 · 资源库", body:
      '<div class="res-box"><p class="res-intro">如果你还想探索更多，可以去看一看这些——纪录片和动画，点开就能看；绘本和书，可以请爸爸妈妈帮你找来读。走，往更深处探一探！</p>'+
      '<div class="res-grid">'+ (RES[u.id]||[]).map(resCard).join("") +'</div></div>'}
  ];
  var cur = 0;
  var quizDone = false;

  function resCard(r){
    return '<div class="res-card"><span class="rt">'+r.t+'</span><h4>'+r.n+'</h4><p>'+r.d+'</p>'+
      (r.u?'<a href="'+r.u+'" target="_blank" rel="noopener">去看 / 去读 '+svgExt()+'</a>':'')+'</div>';
  }

  function renderAct(){
    var act = acts[cur];
    var dots = acts.map(function(a,i){return '<span class="dot'+(i<=cur?' on':'')+'"></span>'}).join("");
    var bar = '<div class="bar"><i style="width:'+((cur+1)/acts.length*100)+'%"></i></div>';
    var navBtns;
    if(cur < acts.length-1){
      navBtns = '<div class="act-nav"><span></span><button class="btn-primary" id="nextBtn">进入下一幕 '+svgChevron()+'</button></div>';
    } else {
      navBtns = '<div class="act-nav"><span></span>'+
        (isDone
          ? '<button class="btn-primary" style="background:var(--moss)" id="stampBtn">'+svgStamp()+' 已盖章 · 再探一次</button>'
          : '<button class="btn-primary" id="stampBtn" style="background:var(--amber)">'+svgStamp()+' 完成探险，盖章</button>')+
        '</div>';
    }
    wrap.innerHTML =
      '<div class="acts-progress">'+dots+bar+'</div>'+
      '<div class="act"><div class="act-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 4.8L19.6 8l-3.8 3.7.9 5.3L12 14.8 7.3 17l.9-5.3L4.4 8l5.2-1.2z"/></svg>'+cur+1+' · '+act.label+'</div>'+act.body+'</div>'+
      navBtns;

    var nb = document.getElementById("nextBtn");
    if(nb) nb.addEventListener("click", function(){ cur++; renderAct(); window.scrollTo({top:wrap.offsetTop-60,behavior:"smooth"}); });
    var sb = document.getElementById("stampBtn");
    if(sb) sb.addEventListener("click", doStamp);
    if(cur===2) bindQuiz();
  }

  function bindQuiz(){
    var opts = wrap.querySelectorAll(".quiz-opt");
    var why = document.getElementById("quizWhy");
    opts.forEach(function(b){
      b.addEventListener("click", function(){
        if(quizDone) return;
        quizDone = true;
        var i = parseInt(b.getAttribute("data-i"),10);
        opts.forEach(function(o,oi){
          if(oi===i){ o.classList.add(o.getAttribute("data-i")==u.quiz.ans?"correct":"wrong"); }
          else o.classList.add("dim");
        });
        why.classList.add("show");
      });
    });
  }

  function doStamp(){
    if(!quizDone && cur<2){ cur=2; renderAct(); return; } /* 未答题：先跳到想一想 */
    store.add(id);
    stampEl.classList.add("show");
    setTimeout(function(){ stampEl.classList.remove("show"); renderUnit(id); }, 1300);
  }

  renderAct();
  window.scrollTo({top:0,behavior:"auto"});
}

function renderTimeline(){
  var items = TL.map(function(t){
    var tag = t[2].split("").map(function(c){return '<span class="u" data-u="'+UNITS.findIndex(function(x){return x.no===c})+'">'+c+'</span>'}).join("");
    return '<div class="tl-item"><div class="y">'+t[0]+'</div><div class="t">'+t[1]+'</div>'+tag+'</div>';
  }).join("");
  app.innerHTML =
    '<section class="tl wrap">'+
      '<div class="tl-head"><h2>全册数学史时间轴</h2><p>从泥板记数到卫星导航——这学期每一站的故事，在人类历史中的坐标</p></div>'+
      '<a href="#/" class="btn-ghost" style="margin-top:18px;display:inline-flex;align-items:center;gap:7px">'+svgBack()+' 返回探险地图</a>'+
      '<div class="tl-line">'+items+'</div>'+
      '<p class="tl-legend">点击右侧单元编号，可跳回对应探险站</p>'+
    '</section>';
  app.querySelectorAll(".tl-item .u").forEach(function(s){
    s.addEventListener("click", function(){
      var idx = parseInt(s.getAttribute("data-u"),10);
      if(idx>=0 && idx<UNITS.length) location.hash = "#/u/"+UNITS[idx].id;
    });
  });
}

/* ===== 渲染：打印手册 ===== */
function renderPrint(){
  var pages = UNITS.map(function(u){
    var pts = PRINT[u.id].map(function(p){return '<li>'+p+'</li>'}).join("");
    return '<section class="print-page">'+
      '<div class="pu-head"><span class="no">'+u.no+'</span><h2>'+u.title+'</h2><span class="tm">'+u.time+'</span></div>'+
      '<img class="pu-pic" src="'+IMG[u.id]+'" alt="">'+
      '<div class="pu-hook">'+u.hook+'</div>'+
      '<div class="pu-points"><h3>故事要点</h3><ul>'+pts+'</ul></div>'+
      '<div class="pu-think"><div class="q">想一想：'+u.quiz.q+'</div>'+
        '<div class="opts">'+u.quiz.opts.map(function(o,i){return '<span><b>'+String.fromCharCode(65+i)+'.</b> '+o+'</span>'}).join("")+'</div>'+
        '<div class="pu-answer">答案：'+String.fromCharCode(65+u.quiz.ans)+'（'+u.quiz.why+'）</div></div>'+
      '<div class="pu-task"><h3>上课小任务</h3><p>'+u.task+'</p></div>'+
      '<div class="pu-foot"><div class="stamp-ring">上完课<br>盖一枚章</div><div class="pu-parent"><b>给家长：</b>'+u.parent+'</div></div>'+
    '</section>';
  }).join("");
  var tl = TL.map(function(t){return '<div class="it"><span class="y">'+t[0]+'</span><span>'+t[1]+'</span></div>'}).join("");
  app.innerHTML =
    '<div class="print-toolbar"><div class="print-toolbar-inner">'+
      '<a class="btn-ghost" href="#/">← 返回地图</a><span class="t">可打印探险手册</span>'+
      '<button class="btn-print no-print" id="doPrint">打印 / 存为 PDF</button>'+
    '</div></div>'+
    '<div class="print-wrap">'+
      '<section class="print-page print-cover">'+
        '<img class="cover-pic" src="'+IMG.hero+'" alt="">'+
        '<h1>四上数学 · 课前探险手册</h1>'+
        '<p class="sub">11 站数学史 · 每单元一页 · 上课前读一读，上完课盖个章</p>'+
        '<div class="print-steps">'+
          '<div class="s"><b>壹 · 上课前</b>和孩子读“好奇钩子”与“故事要点”，先猜后听。</div>'+
          '<div class="s"><b>贰 · 想一想</b>让孩子先口答思考题，家长再念答案核对。</div>'+
          '<div class="s"><b>叁 · 上完课</b>在右下角圆圈里亲手盖一枚章（或画一个）。</div>'+
        '</div>'+
      '</section>'+
      pages+
      '<section class="print-page">'+
        '<div class="pu-head"><span class="no">Ⓣ</span><h2>全册数学史时间轴</h2></div>'+
        '<p style="font-size:13px;color:rgba(38,51,46,.6)">从泥板记数到卫星导航：把整学期的故事串成一条人类史。</p>'+
        '<div class="tl-print">'+tl+'</div>'+
      '</section>'+
    '</div>';
  document.getElementById("doPrint").addEventListener("click", function(){ window.print(); });
  window.scrollTo({top:0,behavior:"auto"});
}

/* ===== 进度条 ===== */
function updateProgress(){
  var n = UNITS.length, done = UNITS.filter(function(u){return store.has(u.id)}).length;
  document.getElementById("miniNum").textContent = done+"/"+n;
  document.getElementById("miniFill").style.width = (done/n*100)+"%";
}

/* ===== 路由 ===== */
function router(){
  var h = location.hash || "#/";
  if(h.indexOf("#/u/")===0){ var id = parseInt(h.slice(4),10); renderUnit(id); }
  else if(h==="#/timeline"){ renderTimeline(); }
  else if(h==="#/print"){ renderPrint(); }
  else { renderHome(); }
  window.scrollTo({top:0,behavior:"auto"});
}
window.addEventListener("hashchange", router);
router();
</script>
</body>
</html>
